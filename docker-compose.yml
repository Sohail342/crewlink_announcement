x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  command: uv run python manage.py runserver 0.0.0.0:8000
  env_file:
    - ./backend/.env
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  depends_on:
    - db
    - redis
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crewlink
      POSTGRES_USER: crewlink
      POSTGRES_PASSWORD: crewlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend-1:
    <<: *backend

  backend-2:
    <<: *backend

  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run celery -A config worker -l info --concurrency=1
    env_file:
      - ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      - redis
      - db
    restart: unless-stopped

volumes:
  postgres_data:
